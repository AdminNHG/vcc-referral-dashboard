async function unlock(e){e.preventDefault();const err=document.getElementById("err");err.style.display="none";try{const pwd=document.getElementById("pwd").value;const enc=new TextEncoder();const passKey=await crypto.subtle.importKey("raw",enc.encode(pwd),"PBKDF2",false,["deriveKey"]);const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(SALT),iterations:200000,hash:"SHA-256"},passKey,{name:"AES-GCM",length:256},false,["decrypt"]);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(IV)},key,b64d(CT));document.open();document.write(new TextDecoder().decode(pt));document.close();}catch(x){err.style.display="block";}return false;}
